plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nabep.gaslift'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nabep.gaslift'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
