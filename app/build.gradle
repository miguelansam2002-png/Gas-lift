plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nabep.gaslift'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nabep.gaslift.testv3'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '3.0.0'
    }

    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
