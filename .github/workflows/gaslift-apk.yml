name: Compilar GasLift NABEP APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GasLift_NABEP_Proyecto_Android_PUBLICO.zip'
      - '.github/workflows/gaslift-apk.yml'

permissions:
  contents: read

jobs:
  generar-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Verificar paquete publico sin base de pozos
        run: |
          test -s GasLift_NABEP_Proyecto_Android_PUBLICO.zip
          unzip -p GasLift_NABEP_Proyecto_Android_PUBLICO.zip GasLift_NABEP_Android/app/src/main/assets/index.html | grep -F 'const BASE=[];'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar SDK Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extraer proyecto
        run: |
          mkdir -p /tmp/gaslift
          unzip -q GasLift_NABEP_Proyecto_Android_PUBLICO.zip -d /tmp/gaslift
          test -f /tmp/gaslift/GasLift_NABEP_Android/app/build.gradle
          test -f /tmp/gaslift/GasLift_NABEP_Android/gradlew

      - name: Compilar APK de prueba
        working-directory: /tmp/gaslift/GasLift_NABEP_Android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: GasLift-NABEP-APK
          path: /tmp/gaslift/GasLift_NABEP_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
