name: Compilar G NABEP APK V4.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/gaslift-apk.yml'

permissions:
  contents: read

jobs:
  generar-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK sin paquete obsoleto tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar Android 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar icono elegido para G NABEP
        run: |
          mkdir -p app/src/main/assets app/src/main/res/drawable-nodpi
          base64 -d branding/g-nabep-icon.webp.b64 > app/src/main/assets/g-nabep.webp
          cp app/src/main/assets/g-nabep.webp app/src/main/res/drawable-nodpi/ic_launcher.webp
          rm -f app/src/main/res/drawable-nodpi/ic_launcher.png
          test -s app/src/main/assets/g-nabep.webp
          test -s app/src/main/res/drawable-nodpi/ic_launcher.webp
          file app/src/main/res/drawable-nodpi/ic_launcher.webp

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Comprobar integridad, firma Android y paquete
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "name='com.nabep.gnabep.mobilev41'"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/index.html | grep -q "G NABEP V4.1"
          test "$(unzip -p "$APK" assets/g-nabep.webp | wc -c)" -gt 3000

      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: G-NABEP-Android-V4-1
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
