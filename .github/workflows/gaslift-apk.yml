name: Compilar GasLift NABEP APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/gaslift-apk.yml'

permissions:
  contents: read

jobs:
  generar-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK sin paquete obsoleto tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar Android 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generar icono real de NABEP desde HTML integrado
        run: |
          python3 - <<'PY'
          import re,base64,pathlib
          html=pathlib.Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          match=re.search(r'<img[^>]*class=["\x27]brand-logo["\x27][^>]*src=["\x27]data:image/png;base64,([A-Za-z0-9+/=]+)',html)
          if not match:
              raise RuntimeError('No se encontro logo NABEP en la aplicacion')
          data=base64.b64decode(match.group(1))
          out=pathlib.Path('app/src/main/res/drawable-nodpi')
          out.mkdir(parents=True,exist_ok=True)
          (out/'ic_launcher.png').write_bytes(data)
          print('Icono institucional listo:',len(data),'bytes')
          PY

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Comprobar integridad, firma Android y paquete
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "name='com.nabep.gaslift.testv3'"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/index.html | grep -q "bottom-tabs"

      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: GasLift-NABEP-V3-Movil
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
